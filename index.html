<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steigel Innovations | Corporate Web &amp; Custom Software Solutions</title>

  <!-- DNS Prefetch for third-party origins -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- Preconnect to Fonts Host Origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Non-render-blocking Google Fonts with font-display:swap -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- Preload the logo (LCP asset) -->
  <link rel="preload" as="image" href="/src/assets/logo.webp" type="image/webp" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#FFFFFF" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
